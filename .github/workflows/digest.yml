name: AI News Digest

on:
  schedule:
    # GitHub dùng giờ UTC (VN = UTC+7). Tránh phút 00 vì giờ chẵn GitHub quá tải, lịch hay bị trễ/bỏ qua.
    # Đặt sớm ~25 phút để bù độ trễ: 23:35 UTC = 06:35 VN, 11:35 UTC = 18:35 VN
    # Mỗi buổi có thêm 1 lần dự phòng (07:05 / 19:05 VN) phòng khi GitHub bỏ qua lần chính;
    # lần dự phòng tự bỏ qua nếu đã có bản tin trong 2 giờ gần nhất.
    - cron: '35 23 * * *'
    - cron: '5 0 * * *'
    - cron: '35 11 * * *'
    - cron: '5 12 * * *'
  workflow_dispatch:        # cho phép bấm "Run workflow" để chạy tay
    inputs:
      resend:
        description: 'Gửi lại cả bài đã gửi (-Resend)'
        type: boolean
        default: false

permissions:
  contents: write           # để lưu lại data/seen.json và digests/ vào repo

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Bỏ qua nếu vừa gửi bản tin (lần chạy dự phòng)
        id: guard
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && \
             [ -n "$(git log -1 --since='2 hours ago' --author='github-actions' --grep='Bản tin' --format=%H)" ]; then
            echo "Đã có bản tin trong 2 giờ gần nhất — bỏ qua."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Đặt múi giờ Việt Nam
        if: steps.guard.outputs.skip != 'true'
        shell: powershell
        run: tzutil /s "SE Asia Standard Time"

      - name: Tạo secrets.json từ GitHub Secrets
        if: steps.guard.outputs.skip != 'true'
        shell: powershell
        env:
          SECRETS_JSON: ${{ secrets.SECRETS_JSON }}
        run: |
          if (-not $env:SECRETS_JSON) { Write-Error 'Chưa khai báo secret SECRETS_JSON trong Settings > Secrets and variables > Actions'; exit 1 }
          [IO.File]::WriteAllText("$PWD\secrets.json", $env:SECRETS_JSON, (New-Object Text.UTF8Encoding $false))

      - name: Chạy bản tin
        if: steps.guard.outputs.skip != 'true'
        shell: powershell
        run: |
          if ('${{ inputs.resend }}' -eq 'true') { .\monitor.ps1 -Resend } else { .\monitor.ps1 }

      - name: Lưu trạng thái và bản lưu trữ vào repo
        if: always() && steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          rm -f secrets.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ digests/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Không có thay đổi để lưu."
          else
            git commit -m "Bản tin $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
