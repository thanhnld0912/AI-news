name: AI News Digest

on:
  # Lịch chính: Cloudflare Worker (telegram-worker/) gọi workflow_dispatch đúng 07:00 và 19:00 VN,
  # và khi bạn gõ /tin cho bot Telegram.
  # Lịch GitHub dưới đây chỉ là dự phòng (GitHub hay bỏ qua lịch): lần nào chạy trước thì gửi,
  # các lần sau tự bỏ qua nhờ bước "guard" (đã có bản tin trong 2 giờ gần nhất).
  # Sáng: 06:05–07:45 VN (23:05–00:45 UTC). Tối: 18:05–19:45 VN (11:05–12:45 UTC).
  schedule:
    - cron: '5,25,45 23 * * *'
    - cron: '5,25,45 0 * * *'
    - cron: '5,25,45 11 * * *'
    - cron: '5,25,45 12 * * *'
  workflow_dispatch:        # "Run workflow" trên GitHub, hoặc do Cloudflare Worker gọi
    inputs:
      resend:
        description: 'Gửi lại cả bài đã gửi (-Resend)'
        type: boolean
        default: false
      notify_empty:
        description: 'Báo lên Telegram khi không có bài mới'
        type: boolean
        default: false
      scheduled:
        description: 'Lần chạy theo lịch (bỏ qua nếu vừa gửi trong 2 giờ)'
        type: boolean
        default: false

permissions:
  contents: write           # để lưu lại data/seen.json và digests/ vào repo

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Bỏ qua nếu vừa gửi bản tin (lần chạy theo lịch)
        id: guard
        shell: bash
        run: |
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.scheduled }}" = "true" ]; } && \
             [ -n "$(git log -1 --since='2 hours ago' --author='github-actions' --grep='Bản tin' --format=%H)" ]; then
            echo "Đã có bản tin trong 2 giờ gần nhất — bỏ qua."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Đặt múi giờ Việt Nam
        if: steps.guard.outputs.skip != 'true'
        shell: powershell
        run: tzutil /s "SE Asia Standard Time"

      - name: Tạo secrets.json từ GitHub Secrets
        if: steps.guard.outputs.skip != 'true'
        shell: powershell
        env:
          SECRETS_JSON: ${{ secrets.SECRETS_JSON }}
        run: |
          if (-not $env:SECRETS_JSON) { Write-Error 'Chưa khai báo secret SECRETS_JSON trong Settings > Secrets and variables > Actions'; exit 1 }
          [IO.File]::WriteAllText("$PWD\secrets.json", $env:SECRETS_JSON, (New-Object Text.UTF8Encoding $false))

      - name: Chạy bản tin
        if: steps.guard.outputs.skip != 'true'
        shell: powershell
        run: |
          $a = @{}
          if ('${{ inputs.resend }}' -eq 'true')       { $a.Resend = $true }
          if ('${{ inputs.notify_empty }}' -eq 'true') { $a.NotifyEmpty = $true }
          .\monitor.ps1 @a

      - name: Lưu trạng thái và bản lưu trữ vào repo
        if: always() && steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          rm -f secrets.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ digests/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Không có thay đổi để lưu."
          else
            git commit -m "Bản tin $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
