name: AI News Digest

on:
  # Lịch chính do Cloudflare Worker (telegram-worker/) gọi qua workflow_dispatch:
  #   - mode=hot   mỗi 30 phút: gửi ngay tin nóng (nếu có)
  #   - mode=digest 07:00 và 19:00 VN: bản tin đầy đủ
  #   - lệnh /tin, /nong, /guilai từ bot Telegram
  # Lịch GitHub dưới đây chỉ là dự phòng vì GitHub hay trễ/bỏ qua lịch:
  #   - '17 * * * *'           -> tin nóng mỗi giờ
  #   - '20 0 * * *', '20 12 * * *' -> bản tin 07:20 / 19:20 VN (tự bỏ qua nếu đã có bản tin trong 2 giờ)
  schedule:
    - cron: '17 * * * *'
    - cron: '20 0 * * *'
    - cron: '20 12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'digest = bản tin đầy đủ, hot = chỉ tin nóng'
        type: choice
        options: [digest, hot]
        default: digest
      resend:
        description: 'Gửi lại cả bài đã gửi (-Resend)'
        type: boolean
        default: false
      notify_empty:
        description: 'Báo lên Telegram khi không có bài mới'
        type: boolean
        default: false
      scheduled:
        description: 'Lần chạy theo lịch (bỏ qua nếu vừa gửi bản tin trong 2 giờ)'
        type: boolean
        default: false

permissions:
  contents: write           # để lưu lại data/seen.json và digests/ vào repo

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '17 * * * *' && 'hot' || 'digest') || inputs.mode || 'digest' }}
    steps:
      # ref: main -> luôn lấy trạng thái MỚI NHẤT (kể cả commit của lần chạy ngay trước),
      # tránh gửi trùng khi nhiều lần chạy nối đuôi nhau.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - name: Bỏ qua nếu vừa gửi bản tin (lần chạy theo lịch)
        id: guard
        shell: bash
        run: |
          if [ "$MODE" = "digest" ] && { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.scheduled }}" = "true" ]; } && \
             [ -n "$(git log -1 --since='2 hours ago' --author='github-actions' --grep='^Bản tin' --format=%H)" ]; then
            echo "Đã có bản tin trong 2 giờ gần nhất — bỏ qua."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Đặt múi giờ Việt Nam
        if: steps.guard.outputs.skip != 'true'
        shell: powershell
        run: tzutil /s "SE Asia Standard Time"

      - name: Tạo secrets.json từ GitHub Secrets
        if: steps.guard.outputs.skip != 'true'
        shell: powershell
        env:
          SECRETS_JSON: ${{ secrets.SECRETS_JSON }}
        run: |
          if (-not $env:SECRETS_JSON) { Write-Error 'Chưa khai báo secret SECRETS_JSON trong Settings > Secrets and variables > Actions'; exit 1 }
          [IO.File]::WriteAllText("$PWD\secrets.json", $env:SECRETS_JSON, (New-Object Text.UTF8Encoding $false))

      - name: Chạy (${{ env.MODE }})
        if: steps.guard.outputs.skip != 'true'
        shell: powershell
        run: |
          $a = @{}
          if ($env:MODE -eq 'hot')                     { $a.Hot = $true }
          if ('${{ inputs.resend }}' -eq 'true')       { $a.Resend = $true }
          if ('${{ inputs.notify_empty }}' -eq 'true') { $a.NotifyEmpty = $true }
          .\monitor.ps1 @a

      - name: Lưu trạng thái và bản lưu trữ vào repo
        if: always() && steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          rm -f secrets.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ digests/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Không có thay đổi để lưu."
          else
            if [ "$MODE" = "hot" ]; then msg="Tin nóng"; else msg="Bản tin"; fi
            git commit -m "$msg $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase -q || true
            git push
          fi
